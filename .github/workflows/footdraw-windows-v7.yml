name: FootDraw Windows v11 new server

on:
  push:
    branches: [chatgpt/footdraw-v11-newserver-20261008]
    paths:
      - 'footdraw/windows-v7-src.part*'
      - 'footdraw/windows-v8-*'
      - 'footdraw/windows-v9_1-*'
      - 'footdraw/windows-v10-*'
      - 'footdraw/windows-v11-*'
      - '.github/workflows/footdraw-windows-v7.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Unpack v7 base
        run: |
          mkdir -p build/windows
          cat footdraw/windows-v7-src.part00 footdraw/windows-v7-src.part01 footdraw/windows-v7-src.part02 footdraw/windows-v7-src.part03 footdraw/windows-v7-src.part04 | base64 -d | tar xzf - -C build/windows
      - name: Apply v8 UI and microphone fixes
        run: |
          cp footdraw/windows-v8-mic_windows.go build/windows/mic_windows.go
          cp footdraw/windows-v8-makeico.go build/windows/makeico.go
          cp footdraw/windows-v8-patch.py build/windows/patch.py
          cd build/windows
          python3 patch.py
          rm patch.py
          sed -i 's/v<-/v < -/g' mic_windows.go
      - name: Apply v9.1 audio, v10 gyro and v11 UI patches
        run: |
          cp footdraw/windows-v9_1-audio-patch.py build/windows/audio_patch.py
          cp footdraw/windows-v10-fix.py build/windows/v10_fix.py
          cp footdraw/windows-v11-patch.py build/windows/v11_patch.py
          cd build/windows
          python3 audio_patch.py
          python3 v10_fix.py
          python3 v11_patch.py
          rm audio_patch.py v10_fix.py v11_patch.py
          gofmt -w main_windows.go mic_windows.go net.go makeico.go
      - name: Point exact V11 desktop client at new server
        working-directory: build/windows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          found=False
          for p in Path('.').glob('*.go'):
              src=p.read_text()
              if 'serverAddr' not in src:
                  continue
              out,n=re.subn(r'(serverAddr\s*=\s*")[^"]+("?)', lambda m: m.group(1)+'31.77.251.51:4950'+m.group(2), src)
              if n:
                  p.write_text(out)
                  print('patched',p,n)
                  found=True
          if not found:
              raise SystemExit('serverAddr assignment not found')
          PY
          grep -R "31.77.251.51:4950" -n .
      - name: Generate shared icon and PE resource
        working-directory: build/windows
        run: |
          go run makeico.go
          rm makeico.go
          go install github.com/akavel/rsrc@v0.10.2
          "$(go env GOPATH)/bin/rsrc" -ico app.ico -o rsrc_windows_amd64.syso
      - name: Build GUI exe
        working-directory: build/windows
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags='-H=windowsgui -s -w' -o FootDraw-Operator-v11-newserver.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: footdraw-windows-v11-newserver
          path: build/windows/FootDraw-Operator-v11-newserver.exe
          if-no-files-found: error
