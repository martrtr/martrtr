name: FootDraw Windows v7

on:
  push:
    branches: [chatgpt/footdraw-build-20260916]
    paths:
      - 'footdraw/windows-v7-src.tar.gz.b64'
      - '.github/workflows/footdraw-windows-v7.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Unpack source
        run: |
          mkdir -p build/windows
          base64 -d footdraw/windows-v7-src.tar.gz.b64 | tar xzf - -C build/windows
      - name: Generate icon and PE resource
        working-directory: build/windows
        run: |
          go run makeico.go
          rm makeico.go
          go install github.com/akavel/rsrc@v0.10.2
          "$(go env GOPATH)/bin/rsrc" -ico app.ico -o rsrc_windows_amd64.syso
      - name: Build GUI exe
        working-directory: build/windows
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags='-H=windowsgui -s -w' -o FootDraw-Operator-v7.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: footdraw-windows-v7
          path: build/windows/FootDraw-Operator-v7.exe
