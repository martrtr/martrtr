name: FootDraw Unified Operators

on:
  push:
    branches: [chatgpt/footdraw-unified-20261007]
    paths:
      - 'operator/**'
      - '.github/workflows/footdraw-windows-v7.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PySide6==6.8.3 numpy==2.2.6 sounddevice==0.5.1 pyinstaller==6.16.0 pillow==11.3.0
      - name: Generate icon
        shell: bash
        run: python operator/make_icon.py
      - name: Build Windows operator
        shell: bash
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon operator/icon.ico --name FootDraw-Operator-Windows operator/footdraw_operator.py
      - name: Verify PE
        shell: pwsh
        run: |
          if (!(Test-Path dist/FootDraw-Operator-Windows.exe)) { throw "missing exe" }
          if ((Get-Item dist/FootDraw-Operator-Windows.exe).Length -lt 1000000) { throw "exe too small" }
      - uses: actions/upload-artifact@v4
        with:
          name: footdraw-operator-windows
          path: dist/FootDraw-Operator-Windows.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev libxcb-cursor0 libegl1
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PySide6==6.8.3 numpy==2.2.6 sounddevice==0.5.1 pyinstaller==6.16.0 pillow==11.3.0
      - name: Generate icon
        run: python operator/make_icon.py
      - name: Build Linux operator
        run: pyinstaller --noconfirm --clean --onefile --name FootDraw-Operator-Linux operator/footdraw_operator.py
      - name: Smoke-test Linux operator
        run: |
          chmod +x dist/FootDraw-Operator-Linux
          set +e
          QT_QPA_PLATFORM=offscreen timeout 4s dist/FootDraw-Operator-Linux --host 127.0.0.1 >/tmp/fd-smoke.log 2>&1
          rc=$?
          set -e
          cat /tmp/fd-smoke.log
          test "$rc" = 124 || test "$rc" = 0
      - name: Build NixOS fallback package
        run: |
          mkdir -p nixos-package
          cp operator/footdraw_operator.py operator/run-linux-nixos.sh operator/icon.png nixos-package/
          chmod +x nixos-package/run-linux-nixos.sh
          tar -czf dist/FootDraw-Operator-Linux-NixOS.tar.gz -C nixos-package .
      - uses: actions/upload-artifact@v4
        with:
          name: footdraw-operator-linux
          path: |
            dist/FootDraw-Operator-Linux
            dist/FootDraw-Operator-Linux-NixOS.tar.gz
          if-no-files-found: error
