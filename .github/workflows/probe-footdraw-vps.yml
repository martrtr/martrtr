name: Probe FootDraw VPS SSH

on:
  push:
    branches: [chatgpt/footdraw-v11-newserver-20261008]
    paths:
      - '.github/workflows/probe-footdraw-vps.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe IPv4 and IPv6
        shell: bash
        run: |
          set +e
          echo "IPv4 31.77.251.51"
          for p in 22 2222 2200 2022 22222 8022 10022 4950 25565 24454 25454; do
            timeout 2 bash -c "</dev/tcp/31.77.251.51/$p" >/dev/null 2>&1
            echo "$p:$?"
          done
          echo "IPv6 2a0c:b641:614:c5::1"
          for p in 22 2222 2200 2022 22222 8022 10022 4950 25565 24454 25454; do
            timeout 2 nc -6 -z -w2 '2a0c:b641:614:c5::1' "$p" >/dev/null 2>&1
            echo "$p:$?"
          done
