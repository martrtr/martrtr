name: FootDraw Unified Android

on:
  push:
    branches: [chatgpt/footdraw-unified-20261007]
    paths:
      - 'footdraw/android/**'
      - '.github/workflows/footdraw-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 and NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' || true
      - name: Build xaga raw-touch helpers
        run: |
          NDK="${ANDROID_HOME}/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          mkdir -p footdraw/android/app/src/main/res/raw
          "$CLANG" -O2 -fPIE -pie footdraw/android/foot_touch.c -o footdraw/android/app/src/main/res/raw/foot_touch
          "$CLANG" -O2 -fPIE -pie footdraw/android/foot_raw.c -o footdraw/android/app/src/main/res/raw/foot_raw
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: footdraw/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s footdraw/android/app/build/outputs/apk/debug/app-debug.apk
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --verbose footdraw/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Stage
        run: |
          mkdir -p dist
          cp footdraw/android/app/build/outputs/apk/debug/app-debug.apk dist/FootDraw-Agent-Android-v12-unified.apk
      - uses: actions/upload-artifact@v4
        with:
          name: footdraw-android-unified
          path: dist/FootDraw-Agent-Android-v12-unified.apk
          if-no-files-found: error
