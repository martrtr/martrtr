name: FootDraw Build
on:
  push:
    branches: [ 'chatgpt/footdraw-build-20260916' ]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 and NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' || true
      - name: Build xaga Foot Mode helpers
        run: |
          NDK="${ANDROID_HOME}/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$CLANG"
          mkdir -p footdraw/android/app/src/main/res/raw
          "$CLANG" -O2 -fPIE -pie footdraw/android/foot_touch.c -o footdraw/android/app/src/main/res/raw/foot_touch
          "$CLANG" -O2 -fPIE -pie footdraw/android/foot_raw.c -o footdraw/android/app/src/main/res/raw/foot_raw
          file footdraw/android/app/src/main/res/raw/foot_touch
          file footdraw/android/app/src/main/res/raw/foot_raw
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: footdraw/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Stage
        run: |
          mkdir -p dist
          cp footdraw/android/app/build/outputs/apk/debug/app-debug.apk dist/FootDraw-Android-v11.apk
      - uses: actions/upload-artifact@v4
        with:
          name: footdraw-android-v11
          path: dist/FootDraw-Android-v11.apk
          if-no-files-found: error
